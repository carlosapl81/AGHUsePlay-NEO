<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGHUse PLAY - Vídeos de Treinamento e Manuais</title>
    
    <!-- Tailwind Play CDN for Premium Utility Class Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
              mono: ["Fira Code", "monospace"],
            },
            colors: {
              brand: {
                green: '#56bc42',
                glow: 'rgba(86, 188, 66, 0.45)',
              }
            },
            animation: {
              ticker: 'ticker 40s linear infinite',
              'pulse-slow': 'pulse-slow 3s ease-in-out infinite',
              float: 'float 6s ease-in-out infinite',
            }
          }
        }
      }
    </script>

    <!-- Custom CSS styles override -->
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <!-- Main Application DOM shell -->
    <div id="aghuse-app">
      
      <!-- Dynamic Background Spot Glow (Soft Lighting) -->
      <div id="ambient-glow-container" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>

      <!-- STICKY HEADER AND NAVIGATION -->
      <nav id="navbar-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between items-center h-20">
            
            <!-- Logo Brand with Soft Outer Glow -->
            <div class="flex items-center gap-3">
              <div class="relative group">
                <div class="absolute -inset-1.5 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-lg blur opacity-75 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
                <div id="brand-logo" class="relative px-3 py-1.5 bg-slate-950 rounded-lg leading-none flex items-center gap-2 select-none">
                  <i data-lucide="play" class="h-5 w-5 text-brand-green fill-brand-green animate-pulse"></i>
                  <span class="font-display font-black text-lg tracking-tight text-white">
                    AGHUse <span class="text-brand-green font-normal">PLAY</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Navigation Options -->
            <ul id="nav-links" class="hidden md:flex items-center gap-6 font-medium text-sm"></ul>

            <!-- Right Command Operations Center (Theme configs, Live Stats, Admin) -->
            <div class="flex items-center gap-4">
              
              <!-- Dynamic Theme Control Switch Panel -->
              <div id="theme-controls" class="flex items-center gap-1.5 bg-slate-900/10 p-1 rounded-xl border border-slate-500/10 backdrop-blur"></div>

              <!-- Instant Search input -->
              <div id="quick-search" class="hidden sm:relative sm:block"></div>

              <!-- Online indicator -->
              <div id="online-badge"></div>

              <!-- Emergency WhatsApp Support Button -->
              <button onclick="setState({ showSuporteModal: true })"
                class="relative inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-black text-slate-950 rounded-lg group bg-gradient-to-br from-yellow-400 to-yellow-600 group-hover:from-yellow-400 group-hover:to-yellow-600 hover:text-slate-900 focus:ring-4 focus:outline-none focus:ring-yellow-800 cursor-pointer mt-2"
              >
                <span class="relative px-3.5 py-1.5 transition-all ease-in duration-75 bg-[#dfcd33] rounded-md group-hover:bg-opacity-0 font-display flex items-center gap-1.5">
                  <i data-lucide="phone" class="w-3.5 h-3.5 fill-slate-950 text-slate-950"></i>
                  <span class="hidden sm:inline">Suporte</span>
                </span>
              </button>

              <!-- Admin gear button -->
              <button id="admin-gear-btn" onclick="setState({ showAdminModal: true })" title="Painel de Gestão">
                <i data-lucide="settings" class="w-4 h-4"></i>
              </button>

            </div>

          </div>
        </div>
      </nav>

      <!-- LETREIRO DE NOTÍCIAS (Scrolling Info Banner) -->
      <div id="news-ticker">
        <div class="bg-brand-green px-4 h-full flex items-center font-display font-black text-xs text-slate-950 uppercase tracking-widest shrink-0 shadow-lg select-none">
          Mural Informativo
        </div>
        <div class="relative w-full overflow-hidden select-none whitespace-nowrap">
          <div id="ticker-slider" class="inline-block animate-ticker hover:[animation-play-state:paused] whitespace-nowrap cursor-help"></div>
        </div>
      </div>

      <!-- MAIN VIEW CONTENT CONTAINER -->
      <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        <div id="main-content-view"></div>
      </main>

      <!-- FOOTER SUPORTE INFORMATION SECTION STRIP -->
      <footer class="mt-20 border-t transition-colors select-none">
        <div id="footer-inner" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col md:flex-row items-center justify-between gap-6">
          
          <div class="flex items-center gap-4 text-left">
            <div class="w-14 h-14 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-brand-green shadow-inner">
              <i data-lucide="phone" class="w-6 h-6 animate-pulse"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-sm tracking-tight">📞 Suporte Técnico AGHUse (TI Hospitalar)</h4>
              <p class="text-xs text-slate-400 font-light pt-0.5">
                WhatsApp: <b>(81) 9.9488-2732</b> &nbsp;|&nbsp; Linha Ramal: <b>3184-3933</b>
              </p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-4">
            <button onclick="setState({ isEditMode: !state.isEditMode })" id="quick-edit-btn"
              class="px-3 py-1.5 rounded-lg text-xs font-bold border transition cursor-pointer hover:border-emerald-500 text-slate-400 border-slate-800"
            >
              🛠️ Ativar Modo Edição
            </button>

            <span class="text-xs text-slate-500 font-mono">
              AGHUse Play © 2026 · Hospital de Alta Complexidade · Tecnologia da Informação
            </span>
          </div>

        </div>
      </footer>

      <!-- MOBILE RESPONSIVE BOTTOM NAVBAR -->
      <div id="mobile-bottom-bar"></div>

      <!-- PORTALS & MODALS WRAPPER -->
      <div id="modals-container"></div>

    </div>

    <!-- Lucide Icons CDN Loader -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Modular scripts imports -->
    <script src="src/js/data.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
